shops","heading":"What you will learn","eyebrow":"","text":"Our workshops are designed for teams that want practical experience with AI agents, automation, and connected systems. Each session combines theory, live demos, and hands-on activities tailored to your business context.","images":[],"ctas":[],"id":"c70","tags":["AI agents","automation","workshop","integration"]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"What you will learn › AI Agent Design & Development","eyebrow":"","text":"Learn how to design, build, and deploy AI agents that automate workflows, interact with business systems, and support real operational tasks. We cover agent architecture, prompt engineering, tool use, and integration patterns that produce reliable, outcome-driven assistants.\n• Agent architectures and decision flows\n• Task planning and multi-agent coordination\n• Tool calling and external-system integration\n• Evaluation, safety, and guardrails","images":["workshop-01-C-qvFGP-.jpg","workshop-02-BuavgFjE.jpg","workshop-03-B8nUu6-G.jpg","workshop-04-CyISRK6X.jpg","workshop-05-DwjkLDSo.jpg"],"ctas":[],"id":"c71","tags":["AI agents","automation","knowledge assistant","integration"]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"What you will learn › Machine Learning for Business","eyebrow":"","text":"A practical introduction to machine learning concepts focused on business use cases. Understand when ML is the right approach, how to prepare data, and how to move from experiments to production-ready models that deliver measurable value.\n• Supervised and unsupervised learning basics\n• Feature engineering and data preparation\n• Model training, validation, and deployment\n• Monitoring and model lifecycle management","images":["workshop-06-CDhaY5da.jpg"],"ctas":[],"id":"c72","tags":[]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"What you will learn › MCP (Model Context Protocol)","eyebrow":"","text":"Explore the Model Context Protocol that enables AI assistants to connect with external tools, APIs, and data sources. Learn how MCP standardises the way agents interact with business systems, databases, and third-party services.\n• MCP architecture and server setup\n• Building custom tools and resources\n• Security, authentication, and access control\n• Real-world integration patterns","images":["workshop-07-Ced3ZmSP.jpg"],"ctas":[],"id":"c73","tags":["MCP","AI agents","knowledge assistant","integration"]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"What you will learn › Agent Skills & Capability Design","eyebrow":"","text":"Define what your AI agent can actually do. This session covers skill identification, capability scoping, and designing reliable agent behaviours so the assistant performs consistently across different business contexts.\n• Skill mapping and capability matrices\n• Prompt patterns for reliable execution\n• Memory, context management, and state\n• Testing and iterative improvement","images":["workshop-08-Ds8m7ebK.jpg"],"ctas":[],"id":"c74","tags":["AI agents","knowledge assistant"]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"What you will learn › Harness Engineering","eyebrow":"","text":"Harness Engineering covers the scaffolding, testing frameworks, and orchestration layers that keep AI agents reliable in production. Learn how to build evaluation harnesses, monitoring systems, and feedback loops that maintain quality as your agent scales.\n• Evaluation frameworks and benchmarking\n• Observability, logging, and tracing\n• Feedback loops and continuous improvement\n• Production deployment and rollback strategies","images":[],"ctas":[],"id":"c75","tags":["AI agents"]},{"type":"page","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"Ready to upskill your team?","eyebrow":"","text":"Book a discovery call and we will design a workshop that fits your team's goals, experience level, and business priorities.\nWhether you are exploring AI for the first time or scaling an existing agent program, we will help you make practical progress fast.\nBook a Workshop","images":[],"ctas":[{"label":"Book a Workshop","to":"#/contact"}],"id":"c76","tags":["AI agents","workshop","contact"]},{"type":"meta","page":"Request a Discovery Call | NextGenius","route":"/workshop","url":"https://nextgenius.com.au/#/workshop","category":"Workshops","heading":"Search/SEO metadata","text":"Title: Request a Discovery Call | NextGenius\nDescription: (none)\nKeywords: (none)\nOG title: (none)","id":"c77","tags":["contact"]},{"type":"page","page":"AI Events Sydney | NextGenius","route":"/events","url":"https://nextgenius.com.au/#/events","category":"Events","heading":"AI Events and Meetup Community in Sydney","eyebrow":"","text":"Practical AI events in Sydney for founders, engineers, business owners, students, and teams exploring AI agents, automation, machine learning, MCP, and AI for business.\nSydney AI community","images":[],"ctas":[],"id":"c78","tags":["MCP","AI agents","automation","Sydney","community"]},{"type":"page","page":"AI Events Sydney | NextGenius","route":"/events","url":"https://nextgenius.com.au/#/events","category":"Events","heading":"Upcoming events and learning formats","eyebrow":"","text":"Use this page to understand what kinds of AI events NextGenius runs, who they are for, and how they connect to workshops and ongoing learning.","images":[],"ctas" of the OPC page","text":"NEXTGENIUS · AUSTRALIA OPC\nEnglish\n中文\n你有专业能力。\n让它成为一门服务。\n\n把你会的东西，变成客户看得懂、愿意买、能交付的服务。从明确客户、梳理套餐，到迈出第一步。\n\n免费生成我的服务方案 ↗\n5 个问题 · 无需注册 · 结果可编辑\n带走一份可以开始行动的草稿\n01\n明确的服务定位\n\n你帮助谁，解决什么问题。\n\n02\n交付与报价框架\n\n服务范围、交付步骤与待验证的报价结构。\n\n03\n第一周行动清单\n\n客户访谈、示例成果与小范围试单。\n\n一个人，也可以有清晰的起点。\n从你的经验开始，不用从零想起。\n\n这里的 OPC 指由一个人主导、借助工具和合作伙伴经营的业务，是一种经营方式，并非特定的澳洲公司注册类型。\n\n有专业经验的人\n\n把专业技能整理成诊断、研究或咨询服务。\n\n开发者与创作者\n\n提供范围明确的搭建实施或内容套餐。\n\n自由职业与副业探索者\n\n把服务讲清楚，让交付更容易执行。\n\n你的第一个服务\n回答 5 个问题，得到一份清晰方案。\n\n用日常语言描述即可。先解决一个具体问题，比列出一长串技能更容易开始。\n\n试填：AI 自动化服务\n\n免费工具在浏览器内使用结构化模板生成草稿，目前未接入 AI API。工具不会提交或存储你的回答。\n\n1. 你擅长什么？\n2. 你希望帮助谁？\n3. 你要解决什么具体问题？\n4. 你希望以什么方式交付？\n诊断与行动方案\n搭建与实施\n内容与研究服务\n培训与辅导\n5. 每周可以投入多少小时？\n3–5\n5–10\n10–20\n20+\n生成我的服务方案 ↗\n\n这是一份用于客户验证的规划草稿。开展服务前，请确认范围、报价及所需资格。\n\n从想法走向服务\n选择你需要的下一步。\n搭建服务页面\n\n讨论如何展示你的服务、示例成果及咨询入口。\n\n咨询页面搭建 ↗\n让交付更轻松\n\n探索交付模板、客户咨询处理与实用自动化。\n\n咨询交付工具 ↗\n连接互补的伙伴\n\n表达加入筹建中的 OPC 网络的意向，告诉我们你能提供什么、需要什么帮助。\n\n了解 OPC 网络 ↗\n\n以上为咨询入口。目前工具尚未提供服务页面自动发布、付费项目或自动化成员交易市场。\n\n分享给正在开始的人\n身边有人正想开始独立经营？\n\n分享这个免费工具。选择渠道，即可复制当前语言的专属链接。\n\n小红书\nX / Twitter\nLinkedIn\n\n链接会在后续咨询草稿中注明来源渠道；目前未添加流量统计追踪。\n\n活动、工作坊与 OPC 网络 ↗","lang":"zh","id":"c142","tags":["OPC"]},{"type":"opc","page":"OPC planner output (中文)","route":"/opc","url":"https://nextgenius.com.au/#/opc","category":"OPC","heading":"Generated plan template › 中文 sample","text":"small Australian service businesses｜诊断与行动方案\n\n服务定位\n我运用workflow design and AI automation，帮助small Australian service businesses解决「too much time spent handling enquiries and follow-ups」，从一项范围明确的诊断与行动方案开始。\n\n首个服务套餐\nsmall Australian service businesses｜诊断与行动方案\n先约定一个目标、交付期限、验收方式及修改次数。每周可投入 3–5 小时，先接一个试单，再根据实际工作量调整容量。\n\n交付流程\n1. 收集约定资料，确认客户最希望解决的问题。\n2. 梳理现有流程，识别可实施的改进。\n3. 交付诊断摘要与行动清单，并向客户说明下一步。\n\n报价结构\n按单次诊断收取固定费用；根据资料量、分析深度与跟进次数确定金额。\n先估算准备、交付、沟通与修改工时，再加上工具费用。金额需结合客户访谈与试单确定，本方案不提供市场价格估值。\n\nAI 可以协助的环节\n需求整理、资料摘要、初稿、检查清单与跟进草稿。对客户交付的内容由你审核；使用客户资料前，约定权限与工具使用范围。\n\n第一周行动\n1. 找 3 位目标客户了解问题与现有解决方式。\n2. 制作一份示例成果，验证交付时间。\ matics, University of Sydney\n\nExperience: 12 years K-12 math teaching\n\nTeaching Style: Inspires thinking, simplifies complexity\n\n👩🏫\nMs. Li - English Lead\n\nEducation: English Major, National University of Singapore\n\nExperience: 8 years English teaching\n\nTeaching Style: Scenario-based teaching, practical focus\n\n👨🏫\nMr. Zhang - Science Tutor\n\nEducation: Dual Degree in Science, University of Melbourne\n\nExperience: 10 years science teaching\n\nTeaching Style: Combines experiments with theory\n\nTarget Audience\nE\nElementary\n\nGrades 1-6, building interest and foundation\n\nM\nMiddle School\n\nGrades 7-9, knowledge system building\n\nH\nHigh School\n\nGrades 10-12, advanced knowledge learning\n\nS\nSpecial Needs\n\nCompetition prep, art students, international programs\n\nOur Advantages\n✓\nQuality Assurance\n\nAll teachers pass 5-round strict selection, with a strong focus on quality and teaching fit.\n\n✓\nScientific System\n\nData-driven learning path planning helps students follow an efficient and structured progression.\n\n✓\nFlexible Learning\n\nMulti-device support makes it easier to learn anytime and fit tutoring around family schedules.\n\n✓","id":"c149","tags":["Sydney","knowledge assistant"]},{"type":"product","page":"STEM Learning App (MathTutor Pro)","route":"https://stem.nextgenius.com.au/home","url":"https://stem.nextgenius.com.au/home","category":"Product site","heading":"STEM Learning App (MathTutor Pro) › part 3","text":"Transparent Progress\n\nReal-time progress tracking keeps results visible and easier to discuss with parents.\n\n✓\nDedicated Support\n\nResponsive support helps students and families stay on track when questions come up.\n\nEarly access and tutor onboarding\nJoin the next phase of K-12 math support\n\nSubscribe and we will help set up your AI Agent Tutor account, share pilot updates, and keep you informed as new tutor capacity opens.\n\nEmail addressSubscribe\n\n© 2026 MathTutor Pro. All rights reserved.\n\nGot any question? Ask us!","id":"c150","tags":["AI agents","pilot","contact"]},{"type":"product","page":"AI Creative Studio","route":"https://studio.nextgenius.com.au/","url":"https://studio.nextgenius.com.au/","category":"Product site","heading":"AI Creative Studio › part 1","text":"AI Creative Studio\nHow it works\nFeatures\nAI loop\nLaunch studio\nAI-POWERED 3D CREATIVE LEARNING PLATFORM\nTeach creative systems thinking through a game-like 3D studio.\n\nAI Creative Studio helps learners build worlds, tackle design challenges, and improve through an integrated challenge, tutor, and critic loop.\n\nLaunch the studio\nSee how it works\n3D creative sandbox\nAI tutor + critic\nChallenge-based learning\nPLATFORM SNAPSHOT\nFrom play to critique in one flow\nBuild\n3D block worlds\n\nCompose cities, systems, and ecosystems with an intuitive worldbuilding interface.\n\nCoach\nLive tutor prompts\n\nGet context-aware guidance while shaping the concept, not only after the fact.\n\nReview\nCritic scoring\n\nMeasure idea clarity, system thinking, spatial design, and challenge fit.\n\nOutcome\nCreative learning that feels like a game\n\nStudents iterate through challenge loops, feedback, and visible progress instead of static lessons.\n\nHOW IT WORKS\nA simple loop that turns making into learning.\n\nThe product combines worldbuilding, structured prompts, and feedback systems so learners stay creative while still being guided.\n\n01\nChoose a challenge\n\nStart with a creative prompt such as a future city, climate-resilient world, or accessible community.\n\n02\nBuild a 3D concept\n\nCompose with a visual palette of living, ecological, systemic, and experiential blocks inside the real studio canvas.\n\n03","id":"c151","tags":["integration","custom software","community"]},{"type":"product","page":"AI Creative Studio","route":"https://studio.nextgenius.com.au/","url":"https://studio.nextgenius.com.au/","category":"Product site","heading":"AI Creative Studio › part 2","text":"Learn through feedback loops\n\nThe tutor suggests next moves, the critic scores the work, and the checklist reveals what your concept still needs.\n\nPRODUCT FEATURES\nBuilt like a startup product, not a static demo.\n\nThe existing studio remains the core experience. The landing page now explains the value proposition and routes directly into it.\n\n3D worldbuilding that teaches systems thinking\n\nLearners sketch ideas as spatial compositions, balancing housing, ecology, culture, and infrastructure in one shared scene.\n\nChallenge-led progression instead of an empty sandbox\n\nEvery mission frames a design problem and turns broad creativity into concrete goals, tradeoffs, and outcomes.\n\nAI roles that coach, critique, and motivate iteration\n\nThe platform combines a tutor, a critic, and a live challenge engine so feedback feels like a studio review, not a toy.\n\nCHALLENGE / TUTOR / CRITIC\nThree systems work together to create the learning loop.\n\nInstead of generic AI chat, the product uses role-based guidance tied directly to what the learner has built.\n\nCHALLENGE\nFrames the mission\n\nThe challenge system turns open-ended building into a learnable exercise with visible goals, progress, and completion scoring.\n\nTUTOR\nGuides the next move\n\nThe tutor watches composition, variety, density, and challenge fit to suggest smart next steps while the learner is building.\n\nCRITIC\nEvaluates the result","id":"c152","tags":["custom software"]},{"type":"product","page":"AI Creative Studio","route":"https://studio.nextgenius.com.au/","url":"https://studio.nextgenius.com.au/","category":"Product site","heading":"AI Creative Studio › part 3","text":"The critic converts the current world into strengths, improvements, rubric scores, and a project summary so iteration stays actionable.\n\nLAUNCH\nOpen the live studio and build the experience behind this landing page.\n\nThe studio view is the real existing app, now connected to this front door without removing any current func es And Procedures","Source References","Customer-Facing Knowledge Experience"]},{"id":12,"size":7,"top":["AI Opportunity Review","AI Consulting And Planning","Roadmap Planning","Existing Platforms Versus Custom Solutions","Operations Teams","Sales Teams","Admin Teams"]},{"id":13,"size":5,"top":["Good AI Meetup","Technical Demos","Applied Business Case Studies","Practical Q and A","Networking"]},{"id":14,"size":5,"top":["Build For Adoption","Support","Team Adoption","Documentation","Training"]},{"id":15,"size":4,"top":["OpenClaw Assistant Setup","Managers","Secure Rollout","Business Assistant Workflows"]},{"id":16,"size":4,"top":["Agent Skills and Capability Design","Skill Mapping and Capability Matrices","Memory and Context Management","Testing and Iterative Improvement"]},{"id":17,"size":3,"top":["Discover","Project Delivery Process","Bottlenecks"]},{"id":18,"size":3,"top":["Discovery Call","Workflow Bottleneck","Book A Workshop"]},{"id":19,"size":3,"top":["Community","Practical Guides","Scoped AI Projects"]},{"id":20,"size":3,"top":["Strategy and Scoping","Discovery Workshops","Recommended Roadmap"]},{"id":21,"size":3,"top":["Pilot and Prove Value","Pilot Assistant or Automation","User Testing"]},{"id":22,"size":3,"top":["Applied AI Workshop for Teams","Business Teams and Technical Leads","Australian Organisations"]},{"id":23,"size":2,"top":["AI Assistants","Company Knowledge"]},{"id":24,"size":2,"top":["Single Useful Workflow","Better Operations Workflow"]},{"id":25,"size":2,"top":["Scope","Success Measures"]},{"id":26,"size":2,"top":["Design, Build, and Rollout","Change Support"]},{"id":27,"size":2,"top":["Builders and Creatives","Implementation or Content Package"]},{"id":28,"size":2,"top":["Delivery Tools","Templates"]}],"reports":{"0":{"title":"NextGenius Company and Learning Content","summary":"This group covers NextGenius itself: who it is, where it is based, and how it helps Australian businesses. It also holds the blog guides on learning AI and networking in Sydney.","findings":["NextGenius combines AI consulting with digital product development, and Next Genius Pty Ltd is the legal entity behind it.","It is located at 15 Broadway, Ultimo and runs the Australia OPC initiative.","Blog guides on Sydney AI meetups, networking events and learning paths link back to NextGenius and its Learn AI Sydney service."]},"1":{"title":"AI Agent and Automation Workshops","summary":"This group describes the hands-on workshops NextGenius runs on AI agents, Model Context Protocol (MCP), machine learning and automation. They are aimed at teams who want practical experience.","findings":["Workshops cover AI agent design, MCP integrations, machine learning for business and harness engineering.","Harness engineering keeps AI agents reliable in production, using evaluation harnesses, observability, feedback loops and rollback.","Workshops are designed for teams wanting practical experience with agents, automation and connected systems."]},"2":{"title":"One Person Company Planner and Network","summary":"This group covers the free service planner, the enquiry forms and the proposed Australian One Person Company (OPC) network. It also says plainly which features are not available.","findings":["The free planner turns five answers into an editable service plan, with a pricing model to validate.","The discovery call and expression of interest forms only prepare an email; nothing is sent or saved by the website.","Member marketplace, service-page publishing and paid programmes are stated as not available."]},"3":{"title":"MathTutor Pro Learning App","summary":"This group covers MathTutor Pro, a STEM learning app with tutors, progress tracking and a free learning checkup for families. It lists the tutors and the student groups the app serves.","findings":["The free learning checkup gives families an AI-generated summary by email and covers selective, opportunity class and HSC readiness.","Named tutors are Mr. Wang for maths, Ms. Li for English and Mr. Zhang for science.","The app offers personalised learning paths, multi-device learning and progress tracking for families."]},"4":{"title":"Sydney AI Meetups and Attendees","summary":"This group covers the Sydney AI meetup and events community run by NextGenius and who it is for. It lists the intended attendee groups and what attendees learn.","findings":["The monthly meetup covers agent design, MCP integrations, automation workflows and implementation lessons.","Events are designed for founders, engineers, operators, students, builders and business leaders.","Events aim to create long-term connections and hands-on education, and guided bootcamps are another way to learn."]},"5":{"title":"Example Service Packages and Pricing","summary":"This group describes example first packages for small Australian service businesses, with their delivery steps and pricing. It also covers support after launch.","findings":["Example packages are Review and Action Plan, Training and Coaching, Content and Research, and Setup and Implementation.","Pricing includes a fixed fee per review, a fee per session or short programme, and a fixed project fee with milestones.","Delivery support after launch aims to stop solutions becoming shelfware."]},"6":{"title":"LunchUp and Example Applications","summary":"This group covers the example applications on the site, mainly LunchUp, a networking app, and the Sydney startup and AI ecosystem map. The examples show product experiences, not measured client outcomes.","findings":["LunchUp offers curated introductions, professional matching, meetup planning, startup news and curated opportunities.","The ecosystem map lists startups, investors and organisations such as Atlassian and Canva.","The site states that the examples are not independently measured client outcomes."]},"7":{"title":"AI Creative Studio Learning Game","summary":"This group covers AI Creative Studio, a game-like 3D studio that teaches creative systems thinking. A challenge, tutor and critic loop guides learners.","findings":["Learners build 3D block worlds balancing housing, ecology, culture and infrastructure.","The critic gives strengths, improvements and rubric scores, and the tutor guides the next move.","It is described as a product demonstration, not a measured client case study."]},"8":{"title":"Workflow Automation and Custom Software","summary":"This group covers NextGenius services for small and medium businesses: connecting systems, automating workflows and building custom software. It focuses on removing manual handovers.","findings":["Connected tools work moves information between CRM, finance and support tools.","Custom software includes internal tools, customer portals, web platforms, dashboards and admin systems.","Services can also enhance existing digital products and operational systems."]},"9":{"title":"Admin Automation and Knowledge Assistant Pilots","summary":"This group covers admin automation and the internal knowledge assistant, and how pilots of them are evaluated. It lists the measures used.","findings":["Admin and follow-up automation reduces copying, status chasing and missed handovers.","The internal knowledge assistant searches policies, procedures and templates.","Pilots measure time to find an answer, source accuracy, staff adoption, manual steps, turnaround time and exception rates."]},"10":{"title":"Event to Workshop Pathway","summary":"This group covers the suggested path for newcomers: start with the events page, join a workshop, then bring a team. It also covers the FAQ that helps visitors decide if NextGenius fits.","findings":["The Curiosity to Capability Pathway runs from an event to a workshop, then a private team session or partnership.","Visitors are advised to start with the events page before exploring workshops, FAQs and resources.","The FAQ answers questions about AI meetups and networking events in Sydney."]},"11":{"title":"RAG Knowledge Assistant for Staff","summary":"This group covers knowledge systems and AI search, mainly an assistant that lets staff search business documents. It also covers internal help desks and customer-facing knowledge.","findings":["The RAG knowledge assistant searches policies and procedures and gives source references and clear review points.","Internal help desks support staff questions and onboarding.","Customer-facing knowledge experiences can be included where appropriate."]},"12":{"title":"AI Consulting and Opportunity Reviews","summary":"This group covers the AI consulting and planning service, which works out where AI fits in a business. It includes opportunity reviews and roadmap planning.","findings":["AI opportunity reviews cover operations, sales and admin teams.","Roadmap planning covers business priorities, costs and next steps.","Consulting also advises on when to use existing platforms versus custom solutions."]},"13":{"title":"What Makes a Good AI Meetup","summary":"This group lists the elements of a useful AI meetup in Sydney. It says what attendees should expect to get from one.","findings":["A good meetup includes technical demos, applied business case studies and practical Q and A.","It leaves room for networking after the session."]},"14":{"title":"Building for Adoption and Support","summary":"This group covers how delivered solutions are made usable by the team. It covers documentation, training and support.","findings":["Building for adoption includes documentation, training and a practical support path.","The support stage helps the team adopt and improve the solution."]},"15":{"title":"Business Assistant Setup Service","summary":"This group covers OpenClaw Assistant Setup, a service that sets up a personal or business assistant. It includes workflows and secure rollout.","findings":["Setup includes assistant workflows linked to documents, systems and daily processes.","It includes support for secure rollout, testing and team adoption, and configuration can be tailored for managers."]},"16":{"title":"Agent Skills and Capability Design","summary":"This group covers a session on defining what an AI agent can do. It covers scoping skills, memory and testing.","findings":["The session covers skill mapping and capability matrices.","It also covers memory, context management and state, plus testing and iterative improvement of agent behaviour."]},"17":{"title":"Discover Stage of Delivery","summary":"This group covers Discover, the first stage of the project delivery process. It looks at the process, users and bottlenecks.","findings":["The delivery process is a path from a business problem to a working solution.","Discover seeks to understand process bottlenecks."]},"18":{"title":"Discovery Call and Workshop Booking","summary":"This group covers the discovery call that visitors can request. It is also how teams book a workshop.","findings":["Visitors are asked to describe one workflow, bottleneck or idea.","Booking a workshop starts with a discovery call, then NextGenius designs a workshop fitting the team's goals."]},"19":{"title":"Community, Guides and Scoped Projects","summary":"This group covers the NextGenius community and the practical guides it shares. It also links community learning to scoped AI projects.","findings":["The community is for people turning AI and professional expertise into practical products, services and businesses.","Practical projects give the community learning context, and community conversations inform implementation."]},"20":{"title":"Strategy and Scoping Engagement","summary":"This group covers Strategy and Scoping, a short engagement that defines the right first move before building. It includes workshops and a roadmap.","findings":["It includes discovery workshops and produces a recommended roadmap."]},"21":{"title":"Pilot and Prove Value Engagement","summary":"This group covers a focused build for one practical use case, so teams can test value before wider rollout. It includes user testing.","findings":["The engagement delivers a pilot assistant or automation for one use case and includes user testing."]},"22":{"title":"Applied AI Workshop for Teams","summary":"This group covers a private workshop for teams. It covers AI opportunities, tooling choices, rollout planning and hands-on examples.","findings":["The workshop is for business teams and technical leads, with hands-on examples for Australian organisations."]},"23":{"title":"AI Assistants from Company Knowledge","summary":"This group covers turning a company's own information into useful AI assistants.","findings":["Company knowledge is the source from which AI assistants are built."]},"24":{"title":"Start With One Workflow","summary":"This group covers the recommended starting point of one useful workflow. It includes a three-step operations example.","findings":["The example flow captures the request and context, finds information and drafts, then reviews decisions and exceptions."]},"25":{"title":"Scope Stage and Success Measures","summary":"This group covers Scope, the delivery stage where the workflow, success measures and boundaries are agreed.","findings":["Scope agrees the success measures for the project."]},"26":{"title":"Design, Build and Rollout Engagement","summary":"This group covers a broader delivery model for businesses that know their direction and need help reaching production. It includes change support.","findings":["Change support is provided during rollout."]},"27":{"title":"Builders and Creatives Packages","summary":"This group covers builders and creatives who can offer a focused implementation or content package.","findings":["Builders and creatives offer a focused package of implementation or content."]},"28":{"title":"Delivery Tools and Templates","summary":"This group covers delivery tools such as templates, enquiry handling and useful automation that make delivery easier.","findings":["Delivery tools include templates explored to make service delivery easier."]}}}}</script>

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok = s => s.toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);
KB.chunks.forEach(c => { c._h = tok(c.heading+' '+c.page); c._b = tok(c.text); c._t = c.tags.map(t=>t.toLowerCase()); });
const df = {}; KB.chunks.forEach(c => new Set([...c._h,...c._b]).forEach(t => df[t]=(df[t]||0)+1));
const idf = t => Math.log(1+KB.chunks.length/(1+(df[t]||0)));
function score(c, terms){
  let s = 0;
  for (const t of terms){
    const m = (arr, w) => { let n = 0; for (const x of arr) if (x===t) n+=1; else if (t.length>2 && x.startsWith(t)) n+=.5; return n*w; };
    const hit = m(c._h,4) + m(c._b,1) + (c._t.includes(t)?3:0);
    if (!hit) return 0; // AND semantics: every term must match
    s += hit*idf(t);
  }
  return s;
}
const mk = (txt, terms) => { let h = esc(txt); for (const t of terms) h = h.replace(new RegExp('(\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','gi'),'<mark>$1</mark>'); return h; };
function chips(id, items, set, label){
  $(id).innerHTML = items.map(([k,n]) => `<button class="chip" aria-pressed="${set.has(k)}" data-k="${esc(k)}">${esc(label?label(k):k)} · ${n}</button>`).join('');
  $(id).onclick = e => { const k = e.target.dataset?.k; if(!k) return; set.has(k)?set.delete(k):set.add(k); render(); };
}
const count = f => Object.entries(KB.chunks.flatMap(f).reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]);
function filtered(){ return KB.chunks.filter(c => (!state.types.size||state.types.has(c.type)) && (!state.cats.size||state.cats.has(c.category)) && (!state.tags.size||c.tags.some(t=>state.tags.has(t)))); }
function viewSearch(){
  const terms = tok(state.q); let rows = filtered();
  if (terms.length) rows = rows.map(c=>[c,score(c,terms)]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]).map(r=>r[0]);
  $('#out').innerHTML = `<p class="meta">${rows.length} result${rows.length===1?'':'s'}${terms.length?'':' (showing all – type to search)'}</p>` + rows.slice(0,80).map(c => {
    const body = c.text.length>900 ? c.text.slice(0,900)+' …' : c.text;
    return `<article class="card"><div class="crumb">${esc(TYPE_LABEL[c.type]||c.type)} · ${esc(c.category)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.route||c.url)}</a>${c.note?` · <span class="warn">${esc(c.note)}</span>`:''}</div>
    <h2>${mk(c.heading,terms)}</h2>${c.image?`<img src="${esc(c.image)}" alt="" style="max-width:260px;border-radius:8px;margin:6px 0">`:''}<pre>${mk(body,terms)}</pre>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</article>`;
  }).join('');
}
function viewOutline(){
  const by = {}; KB.pages.forEach(p => (by[p.category]??=[]).push(p));
  $('#out').innerHTML = `<div class="card tree"><ul>${Object.entries(by).map(([cat,ps]) => `<li><b>${esc(cat)}</b><ul>${ps.map(p=>`<li><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.route)}</a> – ${esc(p.title)} <span class="n">${p.sections} sections · ${p.images} images · meta ${p.metas.description?'✓':'✗ none'}</span></li>`).join('')}</ul></li>`).join('')}</ul></div>`;
}
function viewImages(){
  $('#out').innerHTML = `<div class="grid">${KB.images.map(i=>`<div class="card"><img src="images/${esc(i.file)}" alt="${esc(i.alts[0]||'')}" loading="lazy"><div class="meta"><b>${esc(i.file)}</b><br>${esc(i.desc)}<br>Alt: ${esc(i.alts.join('; ')||'–')}<br>Used: ${esc(i.pages.join(', ')||'–')}</div></div>`).join('')}</div>`;
}
const PAL=['#4e79a7','#f28e2b','#59a14f','#e15759','#b07aa1','#76b7b2','#edc948','#9c755f','#ff9da7','#86bc86','#bab0ac','#d37295'];
const colOf = c => c<0?'#8a97a6':PAL[c%PAL.length];
let fg=null;
function viewGraph(){
  const G=KB.graph; if(!G){$('#out').innerHTML='<p class="meta">No graph data.</p>';return;}
  $('#out').innerHTML='<div class="gwrap"><div id="gv"></div><div id="gp" class="card"><p class="meta">Click a dot to see what it is, what it connects to and the original text. Type in the search box to light up matching dots.</p></div></div><div id="gl"></div>';
  const nodes=G.nodes.map(n=>({...n})), links=G.links.map(l=>({...l}));
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const terms=tok(state.q); let sel=null, focus=null;
  const hit=n=>terms.length&&terms.every(t=>tok(n.name+' '+n.description).some(x=>x.startsWith(t)));
  const nbr=id=>links.filter(l=>(l.source.id??l.source)===id||(l.target.id??l.target)===id).map(l=>byId[(l.source.id??l.source)===id?(l.target.id??l.target):(l.source.id??l.source)]);
  const ink=getComputedStyle(document.body).color;
  const dim=n=>(focus!==null&&n.community!==focus)||(sel&&sel.id!==n.id&&!nbr(sel.id).includes(n))||(terms.length&&!hit(n));
  const el=$('#gv');
  fg=ForceGraph()(el).width(el.clientWidth).height(el.clientHeight).graphData({nodes,links}).nodeId('id')
    .nodeLabel(n=>`${n.name} · ${n.type}`).nodeRelSize(4).nodeVal(n=>1+n.degree*.8)
    .linkColor(l=>'rgba(130,145,160,'+(sel||focus!==null||terms.length?'.12':'.35')+')').linkWidth(l=>.4+l.strength/6)
    .nodeCanvasObject((n,ctx,k)=>{
      const r=Math.sqrt(1+n.degree*.8)*4, d=dim(n);
      ctx.globalAlpha=d?.15:1; ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7); ctx.fillStyle=colOf(n.community); ctx.fill();
      if(sel&&sel.id===n.id){ctx.lineWidth=2/k;ctx.strokeStyle=ink;ctx.stroke();}
      if(!d&&(n.degree>=(k<1.3?10:k<2?6:k<3?3:0)||(sel&&(sel.id===n.id||nbr(sel.id).includes(n)))||hit(n))){ctx.font=`${Math.max(10/k,3)}px system-ui`;ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText(n.name,n.x,n.y+r+Math.max(10/k,3));}
      ctx.globalAlpha=1;})
    .nodePointerAreaPaint((n,c,ctx)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(n.x,n.y,Math.sqrt(1+n.degree*.8)*4+2,0,7);ctx.fill();})
    .onNodeClick(n=>{sel=n;panel(n);fg.linkColor(fg.linkColor());})
    .onBackgroundClick(()=>{sel=null;focus=null;$('#gp').innerHTML='<p class="meta">Click a dot.</p>';fg.linkColor(fg.linkColor());});
  fg.d3Force('charge').strength(-140); fg.d3Force('link').distance(38);
  const fit=()=>{if(fg&&el.isConnected)fg.width(el.clientWidth).height(el.clientHeight);};
  requestAnimationFrame(fit); window.addEventListener('resize',fit);
  let fitted=false; fg.onEngineStop(()=>{if(!fitted){fitted=true;fg.zoomToFit(500,30);}});
  function panel(n){
    const com=G.communities.find(c=>c.id===n.community), rep=(G.reports||{})[n.community];
    const ch=n.chunks.map(id=>KB.chunks.find(c=>c.id===id)).filter(Boolean).slice(0,6);
    const rl=links.filter(l=>(l.source.id??l.source)===n.id||(l.target.id??l.target)===n.id);
    $('#gp').innerHTML=`<h2>${esc(n.name)}</h2><div class="meta"><span style="color:${colOf(n.community)}">●</span> ${esc(n.type)} · group ${n.community<0?'other':n.community+1} · ${n.degree} links · in ${n.chunks.length} text part${n.chunks.length===1?'':'s'}</div>
    <p>${esc(n.description||'')}</p>${rep?`<div class="snip"><b>Group summary:</b> ${esc(rep.title||'')} – ${esc(rep.summary||'')}</div>`:''}
    <h3 class="meta">Connected to</h3>${rl.map(l=>{const o=byId[(l.source.id??l.source)===n.id?(l.target.id??l.target):(l.source.id??l.source)];return `<button class="chip nb" data-id="${esc(o.id)}" title="${esc(l.description)}">${esc(o.name)}</button>`}).join('')}
    <h3 class="meta">Original text</h3>${ch.map(c=>`<div class="snip"><b>${esc(c.heading)}</b><br>${esc(c.text.slice(0,260))}${c.text.length>260?' …':''}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.route)}</a></div>`).join('')}`;
    $('#gp').querySelectorAll('.nb').forEach(b=>b.onclick=()=>{const o=byId[b.dataset.id];sel=o;panel(o);fg.centerAt(o.x,o.y,600);fg.zoom(3,600);});
  }
  $('#gl').innerHTML=G.communities.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="false" title="${esc(c.top.join(', '))}"><i style="background:${colOf(c.id)}"></i>${esc((G.reports||{})[c.id]?.title||c.top[0])} · ${c.size}</button>`).join('');
  $('#gl').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=+b.dataset.c;focus=focus===c?null:c;sel=null;
    document.querySelectorAll('#gl .chip').forEach(x=>x.setAttribute('aria-pressed',focus!==null&&+x.dataset.c===focus));
    const rep=(G.reports||{})[c];$('#gp').innerHTML=focus===null?'<p class="meta">Click a dot.</p>':`<h2>${esc(rep?.title||'Group '+(c+1))}</h2><p>${esc(rep?.summary||'')}</p>${(rep?.findings||[]).map(f=>`<div class="snip">${esc(f)}</div>`).join('')}<div class="meta">Main items: ${esc(G.communities[c].top.join(', '))}</div>`;fg.linkColor(fg.linkColor());};
  if(terms.length){setTimeout(()=>{const h=nodes.filter(hit);if(h.length===1){fg.centerAt(h[0].x,h[0].y,500);fg.zoom(3,500);}},900);}
}
function render(){
  document.querySelector('main').className='wrap'+(state.view==='search'?'':' wide');
  document.querySelectorAll('#views .tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.view));
  const pool = KB.chunks;
  chips('#types',count(c=>[c.type]),state.types,k=>TYPE_LABEL[k]||k);
  chips('#cats',count(c=>[c.category]),state.cats);
  chips('#tags',count(c=>c.tags),state.tags);
  ({search:viewSearch,outline:viewOutline,images:viewImages,graph:viewGraph})[state.view]();
}
$('#views').innerHTML = [['search','Search'],['graph','Graph'],['outline','Site outline'],['images','Images']].map(([v,l])=>`<button class="tab" data-v="${v}">${l}</button>`).join('');
$('#views').onclick = e => { if(e.target.dataset.v){state.view=e.target.dataset.v;render();} };
$('#q').oninput = e => { state.q = e.target.value; if(state.view!=='search'&&state.view!=='graph')state.view='search'; render(); };
$('#stats').textContent = `${KB.chunks.length} chunks · ${KB.pages.length} pages · ${KB.images.length} images · built ${KB.built}`;
render();
</script>
</body>
</html>
