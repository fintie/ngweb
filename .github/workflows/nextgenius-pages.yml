name: Publish NextGenius to GitHub Pages
on:
  push:
    branches: ['codex/nextgenius-package-2026-11-03']
    paths: ['site/**', 'tools/write-redirects.mjs', '.github/workflows/nextgenius-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nextgenius-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: Build static website
        run: npm --prefix site run build
      - name: Preserve custom domain
        run: |
          printf '%s\n' 'nextgenius.com.au' > site/dist/CNAME
          touch site/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
